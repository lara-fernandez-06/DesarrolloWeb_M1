<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buscaminas</title>
        <link rel="shortcut icon" href="media/img/minesweeper.png" >
        <link rel="stylesheet" href="buscaminas.css" type="text/css">
        <script src="buscaminas.js" type="text/javascript" defer></script>
    </head>

    <body>

        <header id="header">BUSCAMINAS</header>

        <main>
            <div id="game">
                <div id="gameHeader">
                    <select id="difficulty">
                        <option value="easy">Fácil</option>
                        <option value="medium" selected>Medio</option>
                        <option value="hard">Difícil</option>
                    </select>
                    <div id="mineCounterContainer" class="gameHeaderContainer">
                        <p id="mineCounter" class="gameHeaderText"></p>
                        <img id="mineCounterFlag" class="gameHeaderImg" src="media/img/flag.png">
                    </div>
                    <div id="chronoContainer" class="gameHeaderContainer">
                        <p id="chrono" class="gameHeaderText">000</p>
                        <img id="chronoImg" class="gameHeaderImg" src="media/img/chrono.png">
                    </div>
                    <div><img id="reloadButton" class="gameHeaderImg" src="media/img/reloadArrow.png"></div>
                </div>
                <div id="board"></div>
            </div>
            <img id="confetti" src="media/img/confetti.gif">
        </main>
        
    </body>

</html>
